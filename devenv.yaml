# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
# If you're using non-OSS software, you can set allowUnfree to true.
# allowUnfree: true

# If you're willing to use a package that's vulnerable, list it below.
# permittedInsecurePackages:
#  - "openssl-1.1.1w"

# If you have more than one devenv, you can merge them.
#imports:
# - ./backend

secretspec:
  enable: true
  provider: keyring # keyring, dotenv, env, 1password, lastpass
  profile: default # profile from secretspec.toml
  # devenv 通过 SecretSpec 解析 CACHIX_AUTH_TOKEN（首次交互式运行会提示输入并存入 keyring），
  # 解析后用于私有缓存拉取/推送，不导出到 shell 环境。
  cachix_auth_token: true
