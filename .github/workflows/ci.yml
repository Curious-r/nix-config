name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # fork PR 的 GITHUB_TOKEN 是只读的，不能写评论；
          # push 事件没有 PR 上下文，也不开评论。
          GITLEAKS_ENABLE_COMMENTS: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

  check:
    name: Flake check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            connect-timeout = 3
            extra-substituters = https://cache.nixos.org https://nix-community.cachix.org https://cache.numtide.com https://nix-on-droid.cachix.org
            extra-trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= nix-on-droid.cachix.org-1:56snoMJTXmDRC1Ei24CmKoUqvHJ9XCp+nidK7qkMQrU=
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          enable_kvm: true
      # 只拉不推：check 构建的都是 nixpkgs 已有路径，不需要占用自家缓存。
      - name: Configure Cachix
        uses: cachix/cachix-action@v17
        with:
          name: curious
          skipPush: true
      - name: Check flake.lock health
        # 用 nixpkgs 打包的 flake-checker，不引入 Determinate 的 action/遥测。
        run: nix run nixpkgs#flake-checker -- --fail-mode --no-telemetry
      - name: Lint workflows
        run: nix run nixpkgs#actionlint
      - name: Check flake
        run: nix flake check
      # aarch64-linux 纯求值，覆盖树莓派与 nix-on-droid 的配置正确性。
      # darwin/i686 已被 nixpkgs 26.11 淘汰，这里只评估 aarch64-linux。
      - name: Check flake (aarch64-linux eval)
        run: nix flake check --no-build --system aarch64-linux
      - name: Check traditional evaluators
        run: |
          nix-instantiate --eval --json --expr 'builtins.attrNames (import ./system.nix)'
          nix-instantiate --eval --json --expr 'builtins.attrNames (import ./home-manager.nix)'
      # Build the wrappers without invoking them: re-encryption requires the
      # local Yubikey and must not run inside CI.
      - name: Check Vaultix CLI wrappers
        run: |
          nix build --no-link -f ./vaultix-cli.nix x86_64-linux.edit
          nix build --no-link -f ./vaultix-cli.nix x86_64-linux.renc

  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          # push 到 main 时对比同分支上次推送的提交；
          # pull_request 事件自动对比 base 分支（忽略此输入）。
          base: ${{ github.ref }}
          filters: |
            build:
              - 'flake.nix'
              - 'flake.lock'
              - 'system.nix'
              - 'context.nix'
              - 'home-manager.nix'
              - 'vaultix.nix'
              - 'vaultix-cli.nix'
              - 'third-party-packages.nix'
              - 'npins/**'
              - 'ci/**'
              - 'machines.nix'
              - 'modules/**'
              - 'overlays/**'
              - 'pkgs/**'
              - 'nixos/**'
              - 'home-manager/**'
              - 'nix-on-droid/**'
              - 'secrets/**'
              - '.github/workflows/ci.yml'

  matrix:
    name: Generate build matrix
    needs: changes
    # 与 build 同样的门控：不涉及构建的改动不用生成矩阵。
    if: needs.changes.outputs.build == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            connect-timeout = 3
            extra-substituters = https://cache.nixos.org https://nix-community.cachix.org https://cache.numtide.com https://nix-on-droid.cachix.org
            extra-trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= nix-on-droid.cachix.org-1:56snoMJTXmDRC1Ei24CmKoUqvHJ9XCp+nidK7qkMQrU=
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          enable_kvm: true
      # 矩阵来自显式清单；NixOS 和独立 HM 已切换到传统求值入口。
      - name: Generate matrix
        id: gen
        run: |
          matrix="$(nix eval --json -f ./ci/jobs.nix)"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs:
      - secrets
      - check
      - changes
      - matrix
    # 只在实际涉及构建产物的变更上跑构建；
    # workflow_dispatch 手动触发时无条件构建。
    if: needs.changes.outputs.build == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runsOn }}
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            connect-timeout = 3
            extra-substituters = https://cache.nixos.org https://nix-community.cachix.org https://cache.numtide.com https://nix-on-droid.cachix.org
            extra-trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= nix-on-droid.cachix.org-1:56snoMJTXmDRC1Ei24CmKoUqvHJ9XCp+nidK7qkMQrU=
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          enable_kvm: true
      # 构建前先订阅自家缓存加速 CI 之间复用；
      # 构建后通过 post-build hook 推送新产物，本地机器也能直接拉取。
      # Cachix 侧记得在 Settings > Upstream caches 里把 nix-community 等公共缓存
      # 配成上游，已存在的路径不会重复占用存储。
      - name: Configure Cachix
        uses: cachix/cachix-action@v17
        with:
          name: curious
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # 排除源码包，减少存储消耗（公共缓存没有的独有闭包仍会推送）。
          pushFilter: "(-source$|nixpkgs\\.tar\\.gz$)"
      # nix-on-droid 的 proot-static 是上游硬编码的 store path，
      # Nix 实例化 derivation 时只认本地 store，先预取进来才能求值。
      - name: Prefetch nix-on-droid bootstrap paths
        if: matrix.prefetch != ''
        run: |
          for p in ${{ matrix.prefetch }}; do
            nix copy --from https://nix-on-droid.cachix.org \
              --option extra-trusted-public-keys 'nix-on-droid.cachix.org-1:56snoMJTXmDRC1Ei24CmKoUqvHJ9XCp+nidK7qkMQrU=' "$p"
          done
      - name: Build
        env:
          ENTRYPOINT: ${{ matrix.entrypoint }}
          ATTR: ${{ matrix.attr }}
          IMPURE: ${{ matrix.impure }}
        # 矩阵中的 attr 可能包含 homeConfigurations."curious@host" 的引号，
        # 因此通过环境变量传递，避免 shell 二次展开。
        run: |
          set -euo pipefail
          args=(--no-link)
          if [[ "$IMPURE" == "true" ]]; then
            args+=(--impure)
          fi
          case "$ENTRYPOINT" in
            system.nix)
              args+=(--file "$ENTRYPOINT" "$ATTR")
              ;;
            flake)
              args+=(".#${ATTR}")
              ;;
            home-manager.nix)
              args+=(--file "$ENTRYPOINT" "$ATTR")
              ;;
            *)
              echo "Unknown entrypoint: $ENTRYPOINT" >&2
              exit 1
              ;;
          esac
          nix build "${args[@]}"

  result:
    name: CI result
    needs:
      - secrets
      - check
      - changes
      - matrix
      - build
    # matrix/build 在不涉及构建的 PR 上会被跳过，这个汇总 job 仍然必须运行，
    # 给分支规则提供一个稳定不变的必填检查名。
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fail on failed required jobs
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
