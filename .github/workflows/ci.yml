name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: gitleaks.toml
          # fork PR 的 GITHUB_TOKEN 是只读的，不能写评论；
          # push 事件没有 PR 上下文，也不开评论。
          GITLEAKS_ENABLE_COMMENTS: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

  check:
    name: Flake check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra_nix_config: |
            connect-timeout = 3
            extra-substituters = https://cache.nixos.org https://nix-community.cachix.org https://cache.numtide.com
            extra-trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
      # 只拉不推：check 构建的都是 nixpkgs 已有路径，不需要占用自家缓存。
      - name: Configure Cachix
        uses: cachix/cachix-action@v17
        with:
          name: curious
          skipPush: true
      - name: Check flake.lock health
        uses: DeterminateSystems/flake-checker-action@v13
        with:
          fail-mode: true
      - name: Lint workflows
        run: nix run nixpkgs#actionlint
      - name: Check flake
        run: nix flake check
      # aarch64-linux 纯求值，覆盖树莓派与 nix-on-droid 的配置正确性。
      # darwin/i686 已被 nixpkgs 26.11 淘汰，这里只评估 aarch64-linux。
      - name: Check flake (aarch64-linux eval)
        run: nix flake check --no-build --system aarch64-linux

  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          # push 到 main 时对比同分支上次推送的提交；
          # pull_request 事件自动对比 base 分支（忽略此输入）。
          base: ${{ github.ref }}
          filters: |
            build:
              - 'flake.nix'
              - 'flake.lock'
              - 'modules/**'
              - 'overlays/**'
              - 'pkgs/**'
              - 'nixos/**'
              - 'home-manager/**'
              - 'nix-on-droid/**'
              - 'secrets/**'
              - '.github/workflows/ci.yml'

  build:
    name: Build ${{ matrix.name }}
    needs:
      - secrets
      - check
      - changes
    # 只在实际涉及构建产物的变更上跑构建；
    # workflow_dispatch 手动触发时无条件构建。
    if: needs.changes.outputs.build == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Laptop NixOS toplevel
            attr: nixosConfigurations.Laptop-Legion-R7000.config.system.build.toplevel
            runs-on: ubuntu-latest
          - name: Server NixOS toplevel
            attr: nixosConfigurations.Server-IdeaPad-G480.config.system.build.toplevel
            runs-on: ubuntu-latest
          - name: Laptop home-manager
            attr: 'homeConfigurations."curious@Laptop-Legion-R7000".activationPackage'
            runs-on: ubuntu-latest
          - name: Server home-manager
            attr: 'homeConfigurations."curious@Server-IdeaPad-G480".activationPackage'
            runs-on: ubuntu-latest
          # 树莓派是 aarch64，x86_64 runner 上构建的闭包在本地无法替换，
          # 用免费的 arm64 runner 构建才能填上路由器需要的缓存。
          - name: Router home-manager (aarch64)
            attr: 'homeConfigurations."curious@Router-RaspberryPi-4B-1".activationPackage'
            runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra_nix_config: |
            connect-timeout = 3
            extra-substituters = https://cache.nixos.org https://nix-community.cachix.org https://cache.numtide.com
            extra-trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
      # 构建前先订阅自家缓存加速 CI 之间复用；
      # 构建后通过 post-build hook 推送新产物，本地机器也能直接拉取。
      # Cachix 侧记得在 Settings > Upstream caches 里把 nix-community 等公共缓存
      # 配成上游，已存在的路径不会重复占用存储。
      - name: Configure Cachix
        uses: cachix/cachix-action@v17
        with:
          name: curious
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # 排除源码包，减少存储消耗（公共缓存没有的独有闭包仍会推送）
          pushFilter: "(-source$|nixpkgs\\.tar\\.gz$)"
      - name: Build
        # 单引号包裹以保留 attr 中 homeConfigurations."curious@host" 的引号
        run: nix build --no-link '.#${{ matrix.attr }}'
