name: Update flake inputs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"

concurrency:
  group: update-flake-inputs
  # 防止 schedule 与手动触发同时运行导致 PR 冲突。
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    name: Update Nix flake inputs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 用 PAT 推送分支并创建 PR，使 bot 打开的 PR 能自动触发 CI。
          token: ${{ secrets.GH_TOKEN_FOR_PR }}
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            connect-timeout = 3
            extra-substituters = https://cache.nixos.org https://nix-community.cachix.org https://cache.numtide.com
            extra-trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          enable_kvm: true
      - name: Update flake inputs
        uses: mic92/update-flake-inputs@v1
        with:
          github-token: ${{ secrets.GH_TOKEN_FOR_PR }}
          pr-labels: dependencies,automated
          commit-message: "chore(deps): update flake input {{input}}{{in}}\n\n{{updateMessage}}"
          # 仓库尚未开启 Allow auto-merge；Mic92 在开启失败时会尝试直接 merge，
          # 所以先保持关闭。开启后把这里改成 'true'。
          auto-merge: "false"
          auto-merge-method: SQUASH
          # 通过 PAT 创建 PR，使 bot 打开的 PR 能自动触发 CI。
