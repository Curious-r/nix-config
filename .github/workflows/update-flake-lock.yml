name: Update flake inputs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"

concurrency:
  group: update-flake-inputs
  # 防止 schedule 与手动触发同时运行导致 PR 冲突。
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    name: Update Nix flake inputs
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 用 GitHub App token 推送分支并创建 PR，使 bot 打开的 PR 能自动触发 CI。
          token: ${{ steps.generate-token.outputs.token }}
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            connect-timeout = 3
            extra-substituters = https://cache.nixos.org https://nix-community.cachix.org https://cache.numtide.com
            extra-trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          enable_kvm: true
      - name: Update flake inputs
        uses: mic92/update-flake-inputs@v1
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          pr-labels: dependencies,automated
          commit-message: "chore(deps): update flake input {{input}}{{in}}\n\n{{updateMessage}}"
