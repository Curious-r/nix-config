name: Auto-merge Bot PRs

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - ready_for_review

# 使用 pull_request_target 以便在可信的 base 分支上下文中访问仓库 secrets。
# Dependabot 的 pull_request 事件无法访问 vars/secrets，导致 GitHub App token 生成失败。
# 本 workflow 仅执行 GitHub API 操作（gh pr merge --auto），不检出或执行 PR 分支代码。
jobs:
  auto-merge:
    if: |
      github.actor == 'dependabot[bot]' ||
      github.actor == 'curiosusbot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Enable auto-merge for bot PRs
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          gh pr merge --auto --squash "${{ github.event.pull_request.number }}"
